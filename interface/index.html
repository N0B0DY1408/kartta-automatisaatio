<!DOCTYPE html>

<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartta järjestelmä</title>

    <!--leafletin css linkki-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

    <link rel="stylesheet"
    href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.css">

    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <header>
        <h1>tereve</h1>
    </header>

    <nav>
        <button id="uusiSuunnitelma">Uusi suunnitelma</button>

        <button id="tallenna">Tallenna nykyinen suunnitelma</button>

        <select id="suunnitelmaValinta">
            <option value="">Valitse suunnitelma</option>
        </select>

        <button id="avaaSuunnitelma">Avaa suunnitelma</button>

        <button id="Tuo">Tuo suunnitelma</button>

        <input type="file" id="TuoInput" accept=".json,application/json" hidden>

        <div id="kojuCounter">
            Myyntikojuja: <span id="kojuCount">0</span>
        </div>

        <div id="saveStatus">Saved</div>
    </nav>

    <div id="sivupaneeli">

        <section id="markers">
            <h2>Kojujen hallinta</h2>
            
        </section>

        <section id="parkit">
            <h2>Parkkipaikkojen hallinta</h2>

        </section>

    </div>

    
    <dialog id="savePlanDialog">
        <form method="dialog">
            <h2>Tallenna suunnitelma</h2>

            <label for="savePlanNameInput">Suunnitelman nimi:</label>

            <input
                type="text"
                id="savePlanNameInput"
                placeholder="Esim. Kesämarkkinat"
                required
            >

            <div class="dialog-buttons">
                <button type="submit" value="save">
                    Tallenna
                </button>

                <button type="submit" value="cancel" formnovalidate>
                    Peruuta
                </button>
            </div>
        </form>
    </dialog>


    <dialog id="kojuDialog">
        <form method="dialog">
            <h2>Uusi myyntikoju</h2>

            <label for="kojuNameInput">Kojun nimi:</label>
            <input
                type="text"
                id="kojuNameInput"
                placeholder="Esim. Kahvila"
                required
                autofocus
            >

            <div class="dialog-buttons">
                <button type="submit" value="create">
                    Luo koju
                </button>


                <button type="submit" value="cancel" formnovalidate>
                    Peruuta
                </button>
            </div>
        </form>
    </dialog>

    <div id="map"></div>

    <!--leafletin js linkki-->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-rotate@0.5.2/dist/leaflet-rotate.js"></script>

    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.min.js"></script>
    
    <script src="scripts/map.js"></script>
    <script src="scripts/luonti.js"></script>
    <script src="scripts/varastointi.js"></script>
    <script src="scripts/tallennus.js"></script>
    <script src="scripts/autotallennus.js"></script>

</body>

</html>
